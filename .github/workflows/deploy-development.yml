name: Deploy Development Client

on:
  push:
    branches: [dev-local-client]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ozzy-client-development
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --runInBand
      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: ${{ vars.CLIENT_DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure restricted SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLIENT_DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CLIENT_DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/client_dev_deploy
          chmod 600 ~/.ssh/client_dev_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy through forced command
        env:
          DEV_HOST: ${{ vars.CLIENT_DEV_HOST }}
          DEV_USER: ${{ vars.CLIENT_DEV_USER }}
        run: |
          ssh -i ~/.ssh/client_dev_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEV_USER@$DEV_HOST" deploy
      - name: Remove SSH key
        if: ${{ always() }}
        run: rm -f ~/.ssh/client_dev_deploy
